# ==========================================================
# Q-AI Hub API - shared settings
# Secrets have NO defaults here: they come from environment variables
# or from a local .env file (gitignored). Local development defaults
# live in application-dev.properties only.
# ==========================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local secrets (gitignored): KEY=VALUE lines in ./.env override the defaults below.
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
# Batch inserts/updates instead of one round-trip per row
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Load lazy/eager collections (event phases, tags, experts...) in batches instead of N+1 queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===============================
# DATABASE MIGRATIONS (Flyway, src/main/resources/db/migration)
# ===============================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Databases created before Flyway (by Hibernate ddl-auto) are recorded as version 1
# instead of re-running the baseline script
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# EXTERNAL SERVICES
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
# Seconds to wait for an answer before giving up (the request then continues without AI)
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}

# ===============================
# API DOCUMENTATION (OpenAPI + Swagger UI at /swagger-ui.html)
# ===============================
# Off by default in production; the dev profile turns it on
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ===============================
# SERVER SETTINGS
# ===============================
server.port=${PORT:8081}
# native = only trust X-Forwarded-* from internal proxies (prevents spoofing the client IP
# to bypass the rate limiter); set to "framework" only behind a trusted reverse proxy
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.error.include-message=never
server.error.include-stacktrace=never

# Frontend origin(s): used for CORS and for links in emails (comma-separated for CORS)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration-base-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# ===============================
# JWT SETTINGS
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=platform-backend

# ===============================
# FILE UPLOAD SETTINGS
# ===============================
file.upload-dir=${UPLOAD_DIR:uploads}
# Per-type limits are enforced in FileUploadService (videos 200 MB, images/PDF 10 MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB
# Large uploads are streamed to a temp file instead of being kept in memory
spring.servlet.multipart.file-size-threshold=1MB

# ===============================
# MAIL SETTINGS
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:}
mail.from.name=Q-AI Hub

# ===============================
# OTP SETTINGS
# ===============================
otp.expiry.minutes=5
otp.max.attempts=3
# TEMPORARY dev switch (enable in .env): fixed OTP code, no email sent
otp.fixed.enabled=${OTP_FIXED_ENABLED:false}
otp.fixed.code=${OTP_FIXED_CODE:}

# ===============================
# SESSION COOKIES (HttpOnly, SameSite=Strict)
# ===============================
# Secure = only sent over HTTPS. Must stay true in production; dev overrides it for http://localhost
app.cookies.secure=${COOKIE_SECURE:true}
