# ==========================================================
# Local development only (profile "dev", the default).
# Never deploy with this profile: it seeds test accounts and
# relaxes cookie security for http://localhost. Override any value in .env.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qaihub?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Let Hibernate evolve the local schema
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Signing key: set JWT_SECRET in backend/.env (64+ random characters, e.g. openssl rand -base64 64).
jwt.secret=${JWT_SECRET:}

# Vite dev server may switch ports (5173 -> 5174...)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# http://localhost has no HTTPS
app.cookies.secure=${COOKIE_SECURE:false}

# Demo accounts created on a brand-new database (see DataInitializer).
# Set them in backend/.env; left empty, random passwords are generated and printed in the log.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.user-password=${SEED_USER_PASSWORD:}
