# ===============================
# DATABASE CONNECTION (H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT SETTINGS
# ===============================
jwt.secret=test-only-signing-key-not-a-secret-0000000000000000000000000000000000
jwt.expiration=86400000
jwt.refresh.expiration=604800000
jwt.issuer=test-issuer

# FILE UPLOAD SETTINGS
# ===============================
file.upload-dir=target/test-uploads

# MAIL SETTINGS
# ===============================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# GEMINI SETTINGS
# ===============================
gemini.api.key=not-a-real-key

# Tests use an in-memory H2 schema created by Hibernate; the migrations are MySQL-specific
spring.flyway.enabled=false
