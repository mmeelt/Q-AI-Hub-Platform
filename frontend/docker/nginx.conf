server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Pitch videos can be up to 200 MB
    client_max_body_size 205m;

    # Same origin for the browser: the session cookies (SameSite=Strict) keep working
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
    }

    # Hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (React Router) all load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
