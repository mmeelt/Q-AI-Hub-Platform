name: qaihub

# Q-AI Hub: the whole platform with one command.
#
#   docker compose up --build        then open http://localhost:8080
#
# Runs the "dev" profile: demo accounts and a demo event on a new database, a fixed
# login code instead of emails, Swagger UI at http://localhost:8081/swagger-ui.html.
# For local use only. Every value below can be overridden in a .env file next to this one
# (see .env.example).

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: qaihub
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-qaihub-local}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-qaihub-local}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/qaihub?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-qaihub-local}
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:*
      COOKIE_SECURE: "false"
      # No email server here: every login code is this one (allowed with the dev profile only)
      OTP_FIXED_ENABLED: ${OTP_FIXED_ENABLED:-true}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-123456}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin#Demo2026}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User#Demo2026}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-8081}:8081"   # API + Swagger UI

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"     # the website

volumes:
  db-data:
  uploads:
